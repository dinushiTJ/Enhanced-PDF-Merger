<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free PDF Merger Online - Merge PDF Files</title>
    <meta name="description" content="Merge PDF files online for free. Combine multiple PDFs into one document directly in your browser without uploading your files.">
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <link rel="canonical" href="https://dinushitj.github.io/Enhanced-PDF-Merger/">
    <meta name="theme-color" content="#fff7fb">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Free PDF Merger Online - Merge PDF Files">
    <meta property="og:description" content="Combine multiple PDF files into one document directly in your browser without uploading your files.">
    <meta property="og:url" content="https://dinushitj.github.io/Enhanced-PDF-Merger/">
    <meta property="og:image" content="https://dinushitj.github.io/Enhanced-PDF-Merger/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Free PDF Merger Online - Merge PDF Files">
    <meta name="twitter:description" content="Combine multiple PDF files into one document directly in your browser without uploading your files.">
    <meta name="twitter:image" content="https://dinushitj.github.io/Enhanced-PDF-Merger/logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- @cantoo/pdf-lib: drop-in pdf-lib fork (same PDFLib global) that can decrypt password-protected PDFs -->
    <script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.11.1/dist/pdf-lib.min.js" integrity="sha384-BcRbGROz3cx4LSKcOw2L5YxAxiJPWIEmXRMrYbXu87aSiU5uMQ4qB9v8FEjrBhhq" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.9.3/tsparticles.confetti.bundle.min.js" integrity="sha384-6wBibQTHV5/0JrJ56FlqHbv7m4+E/jMtOC4OxCI+ZC64SC7HSHPQA0Gp2mfmDnUv" crossorigin="anonymous"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Free PDF Merger Online",
      "url": "https://dinushitj.github.io/Enhanced-PDF-Merger/",
      "description": "A free browser-based tool for combining multiple PDF files into one document.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Merge multiple PDF files",
        "Reorder PDF files",
        "Generate a clickable table of contents",
        "Process files locally in the browser"
      ]
    }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
<div class="container">
    <main>
    <h1>
        <span class="logo-bubble"><img src="logo.png" alt="PDF merger logo"></span>
        <span class="title-text">Free PDF Merger Online</span>
    </h1>
    <div class="stats" id="stats">
        <span id="file-count">0</span> PDFs ready to merge
    </div>

    <div class="drag-drop-area" id="dragDropArea">
        <div class="drag-drop-text"><svg class="drag-drop-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>Drag &amp; Drop PDF files here</div>
        <div class="drag-drop-subtext">or click "Add PDF File" below</div>
    </div>

    <div class="upload-section">
        <button type="button" id="addFileBtn" class="add-file-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add PDF File</button>

        <div id="pdfContainer">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></div>
                <div>No PDF files added yet</div>
                <div class="empty-state-hint">
                    Click "Add PDF File" or drag & drop files to get started
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <label class="toc-toggle">
            <input type="checkbox" id="tocToggle" checked>
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span class="toggle-copy">
                <strong>Include table of contents</strong>
                <small>Add a clickable TOC page to the merged PDF and preview</small>
            </span>
        </label>
        <button type="button" id="mergeBtn" class="merge-btn" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Merge PDFs</button>
        <button type="button" id="clearAllBtn" class="clear-all-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>Clear All</button>
    </div>

    <div id="progress" class="progress"></div>
    <div id="result"></div>
    <p class="docs-link"><a href="docs.html">Learn how to merge PDF files</a></p>
    </main>
</div>

<footer class="site-footer">
    <p>© <span id="year"></span> PDF Merger. Free browser-based PDF tools.</p>
    <nav aria-label="Footer navigation"><a href="docs.html">Documentation</a><a href="https://github.com/dinushiTJ/Enhanced-PDF-Merger">GitHub</a></nav>
</footer>

<script src="script.js"></script>
</body>

</html>
